<section>
<h2>اليوم 1: السفير والعيادة</h2>
<ol>
<li><p>زميل في الشؤون القانونية يكتب في نموذج الجمع: «ألخّص بنود عقود إيجار الأوقاف كل يوم تقريبًا»، ويرفق مسودة عقد مصنفة «مقيد». المهمة متكررة، والمساعد المعتمد يلخّص العقود جيدًا.</p><ul><li><b>أ.</b> A، فالمهمة متكررة وصالحة</li><li><b>ب.</b> B، على عقد مصطنع بالشكل نفسه</li><li><b>ج.</b> C، لأن العقد مصنف «مقيد»</li><li><b>د.</b> D، لأن التصنيف قرار حوكمة البيانات</li></ul></li>
<li><p>سفير الاتصال المؤسسي يقترح في خطته أن يبدأ الزملاء بالمساعد مباشرة ثم يصححوا مخرجه، لأن ذلك «أسرع ويشبه العمل الحقيقي». ما أقوى سبب لتقديم محاولة قصيرة دون مساعد؟</p><ul><li><b>أ.</b> لتظهر للزملاء أخطاء المساعد</li><li><b>ب.</b> لأن المساعد بطيء في القاعة</li><li><b>ج.</b> ليعرف الزميل شكل الصواب أولًا</li><li><b>د.</b> لتقيس مستوى كل زميل قبل العيادة</li></ul></li>
<li><p>زميلة في المالية لخّصت بالمساعد تعميمًا عن مواعيد الصرف، وكتبت: «تحققت: سألت المساعد هل التواريخ صحيحة فقال نعم». التعميم مرفق في طلبها.</p><ul><li><b>أ.</b> اطلبي منه أن يراجع التواريخ مرة ثانية</li><li><b>ب.</b> طابقي كل تاريخ على التعميم المرفق</li><li><b>ج.</b> قارني إجابته بإجابة مساعد آخر</li><li><b>د.</b> أضيفي إلى طلبك جمهور الملخص وطوله</li></ul></li>
<li><p>في عيادة الموارد البشرية، زميل يقول: «أنسخ ما يكتبه المساعد في ردود الإجازات وأرسله، ولم يخطئ مرة». أعددت قبل العيادة ردًا كتبه المساعد فيه رصيد إجازة يختلف عن اللائحة المرفقة.</p><ul><li><b>أ.</b> أخبره أن النسخ دون تحقق مخالف للقواعد</li><li><b>ب.</b> اشرح له لماذا تخطئ المساعدات في الأرقام</li><li><b>ج.</b> اطلب منه مطابقة الرصيد على اللائحة</li><li><b>د.</b> ابدأ معه بمهمة سهلة لا يخطئ فيها المساعد</li></ul></li>
<li><p>تصمم نموذجًا لجمع مهام زملائك في إدارة الموارد البشرية قبل عيادتك الأولى. أي سؤال تحذفه من النموذج؟</p><ul><li><b>أ.</b> كم مرة تؤدي المهمة في الأسبوع؟</li><li><b>ب.</b> صف المهمة في سطرين</li><li><b>ج.</b> أرفق مثالًا من عملك الفعلي</li><li><b>د.</b> هل في مادتها بيانات شخصية؟</li></ul></li>
<li><p>زميل في المالية يطلب في نموذج الجمع: «أريد أن يقرر المساعد أي فاتورة متأخرة نحيلها إلى الشؤون القانونية»، ويرفق قائمة عامة بأرقام الفواتير دون أسماء. في أي فئة تضعها؟</p><ul><li><b>أ.</b> تُعاد إلى صاحبها، فالقرار لا يُفوَّض</li><li><b>ب.</b> تدخل العيادة كما هي، فالقائمة عامة بلا أسماء</li><li><b>ج.</b> تدخل بعد التجريد</li><li><b>د.</b> تُصعَّد إلى حوكمة البيانات</li></ul></li>
<li><p>خطة عيادة من 45 دقيقة فيها: افتتاح 3، ودرس قصير 7، ومثال محلول 8، وممارسة مع المساعد 20، وملاحظات 5، وجمع المهام 2. أي بند من قائمة التحقق لا تستوفيه رغم أن المجموع 45؟</p><ul><li><b>أ.</b> مجموع الكتل</li><li><b>ب.</b> المثال المحلول</li><li><b>ج.</b> جمع آمن لمهام العيادة القادمة</li><li><b>د.</b> الممارسة دون ذكاء اصطناعي</li></ul></li>
<li><p>في عيادتك زملاء يستخدمون المساعد يوميًا منذ سنة، وآخرون لم يستخدموه إلا مرة. كيف تستخدم المثال المحلول؟</p><ul><li><b>أ.</b> مثال كامل وطويل للجميع، ثم الممارسة</li><li><b>ب.</b> مثال قصير للجميع، والمتقدمون يبدؤون المسألة</li><li><b>ج.</b> لا مثال، فالجميع يتعلم من المحاولة</li><li><b>د.</b> مثال للمتقدمين وحدهم، لأنهم أسرع في فهم الخطوات</li></ul></li>
<li><p>في الدراسة الميدانية على طلاب الرياضيات، ماذا حدث لمن تدربوا بمساعد يعطي الإجابة حين سُحب المساعد؟</p><ul><li><b>أ.</b> أدّوا أفضل ممن لم يستخدموه</li><li><b>ب.</b> أدّوا كمن لم يستخدموه</li><li><b>ج.</b> أدّوا أسوأ ممن لم يستخدموه</li><li><b>د.</b> لم تقس الدراسة ما بعد سحب المساعد</li></ul></li>
<li><p>كتب زميل تحت ملخص أعدّه بالمساعد: «تحققت: الملخص مرتب وواضح ولا أخطاء إملائية». ما الملاحظة على تحققه؟</p><ul><li><b>أ.</b> تحققه كافٍ لملخص داخلي</li><li><b>ب.</b> يطابق الأرقام على المصدر</li><li><b>ج.</b> يطلب من المساعد مراجعة الملخص</li><li><b>د.</b> يعيد كتابة الملخص بنفسه</li></ul></li>
<li><p>تكتب ملاحظة على طلب زميلة. أي «تغيير واحد» يستطيع أن ينفذه دون أن يسألك؟</p><ul><li><b>أ.</b> حسّني الطلب ليكون أوضح</li><li><b>ب.</b> أضيفي سياقًا أكثر</li><li><b>ج.</b> الطلب طويل أكثر من اللازم، فاختصريه قليلًا</li><li><b>د.</b> أضيفي: «اذكر رقم المادة بعد كل رقم»</li></ul></li>
<li><p>زميلة متمرسة تقول في العيادة: «أخاف أن يكتب المساعد خطأً باسمي». ما أول ما تفعله؟</p><ul><li><b>أ.</b> تطمئنها بأن المساعد دقيق في الغالب</li><li><b>ب.</b> تبدأ من مهمة تتقنها، وتجعلها تحكم على المخرج</li><li><b>ج.</b> تعرض عليها مزايا الأداة وقوالبها الجاهزة خطوة خطوة</li><li><b>د.</b> تخبرها أن زملاءها كلهم يستخدمونه</li></ul></li>
<li><p>ورقة ملاحظة لجزء من عيادة مجموعها 12 من 16، والبند 5 (ملاحظة تحسّن التحقق) صفر. ما النتيجة؟</p><ul><li><b>أ.</b> اجتياز، لأن المجموع فوق 11</li><li><b>ب.</b> اجتياز بشرط مراجعة البند 5 لاحقًا</li><li><b>ج.</b> لا اجتياز، لأن البند 5 إلزامي</li><li><b>د.</b> لا اجتياز، لأن الحد 14 من 16</li></ul></li>
<li><p>زميل في الاتصال المؤسسي ينشر ما يكتبه المساعد من أخبار دون قراءة. ما أنفع ما تعدّه قبل العيادة؟</p><ul><li><b>أ.</b> محاضرة قصيرة عن أخطاء المساعدات الشائعة في الأخبار</li><li><b>ب.</b> خبرًا كتبه المساعد فيه تاريخ يخالف المصدر</li><li><b>ج.</b> قائمة بالقواعد التي خالفها</li><li><b>د.</b> مهمة سهلة لا يخطئ فيها المساعد</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: المكتبة والقياس والاتفاق</h2>
<ol>
<li><p>في نموذج الجمع، كتبت زميلة في الموارد البشرية: «أريد أن يقترح المساعد من يستحق الترقية هذا العام من سجلات الأداء». لم ترفق شيئًا.</p><ul><li><b>أ.</b> تُصعَّد إلى المدير والموارد البشرية</li><li><b>ب.</b> تدخل العيادة كما هي، فلا ملف مرفق</li><li><b>ج.</b> تدخل بعد تجريد سجلات الأداء من الأسماء</li><li><b>د.</b> تُرسل إلى حوكمة البيانات لتحدد تصنيفها</li></ul></li>
<li><p>مدخل من الموارد البشرية: النوع «طلب»، والمالك «تالا الرشودي»، وقاعدة البيانات «الصق طلب الإجازة كما هو من النظام»، والتاريخان ومثال الاختبار وخطوة التحقق كلها مكتوبة.</p><ul><li><b>أ.</b> المالك شخص لا إدارة</li><li><b>ب.</b> حقل ناقص من الحقول السبعة</li><li><b>ج.</b> النوع «طلب» لا يحتاج إلى اختبار</li><li><b>د.</b> القاعدة تدخل بيانات موظف شخصية</li></ul></li>
<li><p>مدخل في مكتبة المالية استُخدم 22 مرة في تسعين يومًا، وتاريخ مراجعته لم يفت، وقاعدة بياناته آمنة، لكن اختباره الأخير أخفق: أضاف المساعد بندًا ليس في العرض.</p><ul><li><b>أ.</b> يبقى، لأنه مستخدم كثيرًا</li><li><b>ب.</b> يُراجَع، لأن اختباره أخفق</li><li><b>ج.</b> يُسحب، لأن مخرجه غير موثوق</li><li><b>د.</b> يبقى حتى موعد مراجعته القادمة</li></ul></li>
<li><p>يسأل مدير الشؤون القانونية: «هل يوفّر المساعد وقت فريقي في مذكرات الرأي؟». لديك تقرير الاستخدام، واستبيان أجاب عنه ثلث الفريق، وأسبوعان لجمع دليل جديد.</p><ul><li><b>أ.</b> عدد الجلسات في تقرير الاستخدام</li><li><b>ب.</b> متوسط الوقت الموفّر في الاستبيان</li><li><b>ج.</b> عينة توقيت على مذكرات حقيقية</li><li><b>د.</b> نسبة الراضين عن المساعد في الفريق</li></ul></li>
<li><p>في الشؤون القانونية، أرسل زميل إلى إدارة أخرى مذكرة أعدّها بالمساعد تستند إلى «التعميم رقم 9 لعام 1446». لم يفتح أحد التعميم، وتبيّن أن رقمه غير موجود.</p><ul><li><b>أ.</b> كل مرجع يُفتح ويُقرأ قبل نقله</li><li><b>ب.</b> سطر إفصاح في كل مستند يُشارك</li><li><b>ج.</b> البيانات الشخصية خارج أي مساعد</li><li><b>د.</b> رسالة إعادة دون لوم بعد اكتشاف الخطأ</li></ul></li>
<li><p>مدخل في مكتبة الهيئة حقل مالكه «إدارة الاتصال المؤسسي». ما المشكلة؟</p><ul><li><b>أ.</b> لا مشكلة، فالإدارة تملك المدخل</li><li><b>ب.</b> المالك يجب أن يكون السفير الأعلى رتبة</li><li><b>ج.</b> حقل المالك اختياري في المكتبة</li><li><b>د.</b> لا أحد بعينه يراجعه أو يُسأل عنه</li></ul></li>
<li><p>قاعدة البيانات في مدخل: «الصق ملف الموظف كاملًا ليكون التقرير دقيقًا». ماذا تفعل قبل النشر؟</p><ul><li><b>أ.</b> تنشره، فالمدخل يعمل جيدًا</li><li><b>ب.</b> تعيد كتابة القاعدة بقيم مصطنعة</li><li><b>ج.</b> تحذف المدخل من المكتبة نهائيًا وتبلغ مالكه</li><li><b>د.</b> تضيف تنبيهًا وتتركه كما هو</li></ul></li>
<li><p>مدخل لم يُستخدم في تسعين يومًا، وتاريخ مراجعته فات قبل شهرين، واختباره ناجح. ماذا تقرر بالقاعدة؟</p><ul><li><b>أ.</b> يُسحب</li><li><b>ب.</b> يبقى، لأن اختباره ناجح</li><li><b>ج.</b> يُراجَع، لأن تاريخه فات</li><li><b>د.</b> يبقى حتى يطلب أحد حذفه</li></ul></li>
<li><p>تريد أن يعرف المساعد في كل محادثة مصطلحات الأوقاف المعتمدة بالعربية والإنجليزية. ما نوع المدخل؟</p><ul><li><b>أ.</b> طلب</li><li><b>ب.</b> بطاقة تفويض</li><li><b>ج.</b> سياق دائم</li><li><b>د.</b> مذكرة سحب</li></ul></li>
<li><p>في دراسة METR لعام 2025، قدّر المطورون بعد العمل أن المساعد سرّعهم 20%. ماذا قاست الدراسة؟</p><ul><li><b>أ.</b> تسريعًا بنحو 20%</li><li><b>ب.</b> تسريعًا بنحو 24%</li><li><b>ج.</b> لا فرق يُذكر في الوقت بين الحالتين</li><li><b>د.</b> استغرقوا وقتًا أطول بنحو 19%</li></ul></li>
<li><p>أجاب عن استبيان الرضا 40% من الموظفين، ومتوسط الاستخدام الأسبوعي الذي أعلنوه ضعف ما في تقرير الاستخدام لكل الموظفين. ما أرجح تفسير؟</p><ul><li><b>أ.</b> تقرير الاستخدام لا يحسب كل الجلسات</li><li><b>ب.</b> من أجاب هم الأكثر استخدامًا غالبًا</li><li><b>ج.</b> الموظفون يستخدمون أدوات أخرى أيضًا</li><li><b>د.</b> الاستبيان أدق لأنه من الموظفين أنفسهم</li></ul></li>
<li><p>في عينة توقيت: المهمة دون المساعد 40 دقيقة، والمسودة بالمساعد 15، والتحقق 10، وإعادة العمل 12. كم الوقت الصافي الموفر؟</p><ul><li><b>أ.</b> 25 دقيقة</li><li><b>ب.</b> 15 دقيقة</li><li><b>ج.</b> 3 دقائق</li><li><b>د.</b> لا وفر، فالمهمة أطول</li></ul></li>
<li><p>تقرير شهري يقول: «جرّب المساعد 90% من الموظفين، فالتبني ناجح». ما الذي ينقص هذا المؤشر أولًا؟</p><ul><li><b>أ.</b> تعريف للاستخدام المنتظم</li><li><b>ب.</b> رسم بياني أوضح للنسبة</li><li><b>ج.</b> مقارنة بجهة أخرى</li><li><b>د.</b> نسبة من يرضون عن المساعد</li></ul></li>
<li><p>وصلك من زميل جدول من عشرين صفًا أعدّه بالمساعد، ومجموعه لا يشمل آخر ثلاثة صفوف. أي رسالة تعيده بها؟</p><ul><li><b>أ.</b> «الجدول خاطئ، راجعه قبل أن ترسل»</li><li><b>ب.</b> «لا تعتمد على المساعد في الجمع والحساب بعد اليوم»</li><li><b>ج.</b> تصحح المجموع بنفسك وترسله</li><li><b>د.</b> «المجموع يسقط الصفوف 18 إلى 20، أعِده»</li></ul></li>
<li><p>أُرسل خطاب إلى مستفيد بمبلغ يخالف قرار اللجنة، كتب المساعد مسودته وراجعه كاتبه وحده. أي بند في اتفاق الوحدة كان سيمنعه؟</p><ul><li><b>أ.</b> الإفصاح عن استخدام المساعد في كل مستند</li><li><b>ب.</b> البيانات خارج المساعد</li><li><b>ج.</b> مراجعة ثانية لما يخرج من الإدارة</li><li><b>د.</b> مراجعة الاتفاق كل ستة أشهر</li></ul></li>
<li><p>في استطلاع Stanford وBetterUp لعام 2025 عن «workslop»، ماذا قال من تلقوه عن مرسله؟</p><ul><li><b>أ.</b> زادت ثقتهم به لأنه يستخدم الذكاء الاصطناعي</li><li><b>ب.</b> قلّت ثقة 42% منهم به</li><li><b>ج.</b> لم يلاحظوا أنه من إنتاج المساعد</li><li><b>د.</b> أعادوه كلهم إلى مرسله</li></ul></li>
<li><p>في تقرير الثلاثين يومًا، أي دليل على التغير المقيس أقوى عند المراجع؟</p><ul><li><b>أ.</b> قول الزملاء إن العيادة أفادتهم</li><li><b>ب.</b> عدد الزملاء الذين حضروا العيادة</li><li><b>ج.</b> صورة لمكتبة الوحدة بعد إنشائها</li><li><b>د.</b> عينة توقيت قبل العيادة وبعدها</li></ul></li>
</ol>

},"level":"understand","pool":"practice"},{"id":"q-measure-02","type":"single","prompt":"أجاب عن استبيان الرضا 40% من الموظفين، ومتوسط الاستخدام الأسبوعي الذي أعلنوه ضعف ما في تقرير الاستخدام لكل الموظفين. ما أرجح تفسير؟","options":[{"key":"أ","text":"تقرير الاستخدام لا يحسب كل الجلسات"},{"key":"ب","text":"من أجاب هم الأكثر استخدامًا غالبًا"},{"key":"ج","text":"الموظفون يستخدمون أدوات أخرى أيضًا"},{"key":"د","text":"الاستبيان أدق لأنه من الموظفين أنفسهم"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الاستجابة اختيارية، والأكثر استخدامًا أكثر رغبة في الإجابة، فيبالغ الاستبيان في الاستخدام. اقرأ من أجاب قبل أن تقرأ ما قالوه.","misconceptions":["يشك في السجل قبل أن يشك في العينة","","يفترض سببًا لا دليل عليه في البيانات","يرفع التقرير الذاتي فوق السجل"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"survey-who-answers","title":"اقرأ من أجاب قبل أن تقرأ ما قالوه"},"level":"analyze","pool":"practice"},{"id":"q-measure-03","type":"single","prompt":"في عينة توقيت: المهمة دون المساعد 40 دقيقة، والمسودة بالمساعد 15، والتحقق 10، وإعادة العمل 12. كم الوقت الصافي الموفر؟","options":[{"key":"أ","text":"25 دقيقة"},{"key":"ب","text":"15 دقيقة"},{"key":"ج","text":"3 دقائق"},{"key":"د","text":"لا وفر، فالمهمة أطول"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"الصافي = 40 ناقص (15 + 10 + 12) = 3 دقائق. التحقق وإعادة العمل جزء من الوقت مع المساعد.","misconceptions":["يحسب المكسب الإجمالي وينسى التحقق وإعادة العمل","يطرح التحقق وينسى إعادة العمل","","يخطئ في الجمع: المجموع 37 من 40"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"net-time","title":"التحقق وإعادة العمل أكلا نصف المكسب"},"level":"apply","pool":"practice"},{"id":"q-measure-04","type":"single","prompt":"تقرير شهري يقول: «جرّب المساعد 90% من الموظفين، فالتبني ناجح». ما الذي ينقص هذا المؤشر أولًا؟","options":[{"key":"أ","text":"تعريف للاستخدام المنتظم"},{"key":"ب","text":"رسم بياني أوضح للنسبة"},{"key":"ج","text":"مقارنة بجهة أخرى"},{"key":"د","text":"نسبة من يرضون عن المساعد"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"«جرّب مرة» يحسب من فتح المساعد مرة واحدة. الاستخدام المنتظم يُعرَّف بعدد أسابيع النشاط، ويكون عادة أقل بكثير.","misconceptions":["","يصلح العرض لا التعريف","يقارن قبل أن يعرّف","يضيف رأيًا ذاتيًا آخر بدل تعريف دقيق"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"three-indicator-families","title":"الاستخدام والقيمة والجودة لا يحل أحدها محل الآخر"},"level":"evaluate","pool":"practice"},{"id":"q-agreement-01","type":"single","prompt":"وصلك من زميل جدول من عشرين صفًا أعدّه بالمساعد، ومجموعه لا يشمل آخر ثلاثة صفوف. أي رسالة تعيده بها؟","options":[{"key":"أ","text":"«الجدول خاطئ، راجعه قبل أن ترسل»"},{"key":"ب","text":"«لا تعتمد على المساعد في الجمع والحساب بعد اليوم»"},{"key":"ج","text":"تصحح المجموع بنفسك وترسله"},{"key":"د","text":"«المجموع يسقط الصفوف 18 إلى 20، أعِده»"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"رسالة الإعادة تقول ما المشكلة، وأين، وما المطلوب، دون حكم على الشخص. هكذا يتعلم الزميل ولا يدافع.","misconceptions":["يحكم دون أن يقول أين المشكلة","يحكم على الأداة والشخص بدل المشكلة","يصلح دون أن يعرف الزميل فيتكرر الخطأ",""],"lo":["LO5"],"day":2,"session":4,"slide":{"deck":"day2","id":"return-without-blame","title":"أعد العمل الضعيف برسالة تصف المشكلة، لا الشخص"},"level":"apply","pool":"practice"},{"id":"q-agreement-02","type":"single","prompt":"أُرسل خطاب إلى مستفيد بمبلغ يخالف قرار اللجنة، كتب المساعد مسودته وراجعه كاتبه وحده. أي بند في اتفاق الوحدة كان سيمنعه؟","options":[{"key":"أ","text":"الإفصاح عن استخدام المساعد في كل مستند"},{"key":"ب","text":"البيانات خارج المساعد"},{"key":"ج","text":"مراجعة ثانية لما يخرج من الإدارة"},{"key":"د","text":"مراجعة الاتفاق كل ستة أشهر"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"ما يصل إلى مستفيد يراجعه زميل ثانٍ، والخطأ الخارجي يُبلَّغ ويُصحَّح لدى من وصله.","misconceptions":["الإفصاح لا يصحح الرقم","لا بيانات دخلت المساعد في الحا
